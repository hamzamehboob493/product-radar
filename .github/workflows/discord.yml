name: Post digest to Discord

on:
  push:
    branches: [main]
    paths:
      - "digests/**"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: discord-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Post new digests to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          BEFORE: ${{ github.event.before }}
        run: python3 .github/scripts/post_to_discord.py
